  <!-- Barres horizontales pour le E -->
  <line x1="50" y1="35" x2="70" y2="35" stroke="#0066CC" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="70" y2="50" stroke="#0066CC" stroke-width="4" stroke-linecap="round"/>
