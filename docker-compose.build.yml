# Override local : build les images + expose le frontend sur l'hôte
# Usage : docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# Ne pas utiliser ce fichier sur Coolify (conflit de ports entre instances).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-14001}:80"
