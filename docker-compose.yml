# DevToolbox — Docker Compose (Coolify / production)
#
# Images GHCR (pré-construites) :
#   ghcr.io/crollin/devtoolbox-frontend:<tag>
#   ghcr.io/crollin/devtoolbox-backend:<tag>
#
# Variables utiles :
#   IMAGE_TAG=latest|1.0.0   — tag des images GHCR
#   JWT_SECRET               — obligatoire (openssl rand -base64 32)
#   CORS_ORIGIN, FRONTEND_URL — URL publique du frontend

services:
  backend:
    image: ghcr.io/crollin/devtoolbox-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devtoolbox-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-1400}
      DB_PATH: ${DB_PATH:-/app/data/devtoolbox.db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini (ex: openssl rand -base64 32)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:14001}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:14001}
    volumes:
      - devtoolbox_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:1400/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/crollin/devtoolbox-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devtoolbox-frontend
    ports:
      - "${FRONTEND_PORT:-14001}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  devtoolbox_data:
    driver: local
