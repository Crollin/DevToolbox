# DevToolbox - Docker Compose (Coolify / production)
#
# Coolify : build sur le serveur (images GHCR privees) ou pull si registry configure.
# Local build explicite : docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# Variables Coolify (Runtime only) : JWT_SECRET, CORS_ORIGIN, FRONTEND_URL, IMAGE_TAG

services:
  backend:
    image: ghcr.io/crollin/devtoolbox-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-1400}
      DB_PATH: ${DB_PATH:-/app/data/devtoolbox.db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:14001}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:14001}
    volumes:
      - devtoolbox_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:1400/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/crollin/devtoolbox-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    # Pas de ports hôte : Coolify (Traefik/Caddy) proxifie vers le conteneur.
    # Évite "Bind … port is already allocated" si plusieurs instances coexistent.
    # Accès local : docker-compose.build.yml mappe FRONTEND_PORT (défaut 14001).
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  devtoolbox_data:
    driver: local
