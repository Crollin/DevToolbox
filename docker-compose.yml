# Configuration Docker Compose pour DevToolbox
# Frontend : export Markdown (.md, PDF, DOCX)
#
# Pour le déploiement sur serveurs distants avec credentials Docker :
# 1. Configurez les credentials avant de lancer docker-compose :
#    echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
# 2. Ou utilisez un fichier .env avec DOCKER_USERNAME et DOCKER_PASSWORD
# 3. Voir docker/README-DEPLOY.md pour plus de détails

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devtoolbox-backend
    # Pas de ports exposés : l'API est accessible uniquement via le frontend (/api). En local, utiliser docker-compose --env-file .env up et accéder au frontend.
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-1400}
      - DB_PATH=${DB_PATH:-/app/data/devtoolbox.db}
      # JWT obligatoire en production (Coolify affiche une alerte si vide). En local : docker-compose --env-file .env up
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET doit être défini (ex: openssl rand -base64 32)}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:14001}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:14001}
    volumes:
      - devtoolbox_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:1400/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devtoolbox-frontend
    ports:
      - "14001:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  devtoolbox_data:
    driver: local

