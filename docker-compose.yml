# Configuration Docker Compose pour DevToolbox
# 
# Pour le déploiement sur serveurs distants avec credentials Docker :
# 1. Configurez les credentials avant de lancer docker-compose :
#    echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
# 2. Ou utilisez un fichier .env avec DOCKER_USERNAME et DOCKER_PASSWORD
# 3. Voir docker/README-DEPLOY.md pour plus de détails

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devtoolbox-backend
    ports:
      - "1400:1400"
    environment:
      - NODE_ENV=production
      - PORT=1400
      - DB_PATH=/app/data/devtoolbox.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:1400/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devtoolbox-frontend
    ports:
      - "14001:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data:
    driver: local

